<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Sync Portal - Pardy Surveys</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        // Load the React component
        fetch('/app.js')
            .then(response => response.text())
            .then(script => {
                eval(Babel.transform(script, { presets: ['react'] }).code);
            })
            .catch(error => {
                console.error('Error loading app:', error);
                document.getElementById('root').innerHTML = '<div class="min-h-screen bg-gray-50 flex items-center justify-center"><div class="text-center"><p class="text-red-600">Error loading application</p><p class="text-sm text-gray-600 mt-2">' + error.message + '</p></div></div>';
            });
    </script>
    
    <style>
        /* Custom styles for the Trimble Sync interface */
        .folder-tree {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .drag-active {
            background-color: rgba(59, 130, 246, 0.1);
            border-color: rgb(59, 130, 246);
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Mobile-specific styles */
        @media (max-width: 768px) {
            .min-h-screen {
                min-height: 100vh;
                min-height: -webkit-fill-available;
            }
        }
        
        /* Mobile view styling for existing components */
        .mobile-view .hover\:bg-gray-100:hover {
            background-color: transparent;
        }
        
        .mobile-view .hover\:bg-gray-100:active {
            background-color: rgba(0, 0, 0, 0.05);
        }
        
        .mobile-view button {
            min-height: 44px;
            font-size: 14px;
        }
        
        .mobile-view .py-1 {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }
        
        .mobile-view .text-xs {
            font-size: 0.875rem;
        }
        
        .mobile-view .w-4.h-4 {
            width: 1.25rem;
            height: 1.25rem;
        }
        
        /* Disable text selection on mobile for native feel */
        .select-none {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* Ripple effect for buttons */
        button {
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        button:active::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            animation: ripple 0.6s ease-out;
        }
        
        @keyframes ripple {
            to {
                width: 200px;
                height: 200px;
                opacity: 0;
            }
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        
        /* Icon animations */
        .animate-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</body>
</html>
